apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Sagar-CloudNative/gitops-argocd-tutorial-series.git
    targetRevision: HEAD
    path: episode-04-deploy-first-application/guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook
  syncPolicy: {}
