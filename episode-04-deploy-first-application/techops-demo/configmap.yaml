apiVersion: v1
kind: ConfigMap
metadata:
  name: techops-demo-html
  namespace: demo
  labels:
    app: techops-demo
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>TechOps Tutorials | Argo CD Demo</title>
      <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
          color: #f1f5f9;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
        }

        .card {
          background: rgba(30, 41, 59, 0.7);
          border: 1px solid rgba(148, 163, 184, 0.2);
          border-radius: 16px;
          padding: 48px 40px;
          max-width: 560px;
          width: 100%;
          text-align: center;
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
          backdrop-filter: blur(10px);
        }

        .badge {
          display: inline-block;
          background: linear-gradient(90deg, #22d3ee, #3b82f6);
          color: #0f172a;
          font-weight: 700;
          font-size: 12px;
          letter-spacing: 1.5px;
          text-transform: uppercase;
          padding: 6px 14px;
          border-radius: 999px;
          margin-bottom: 20px;
        }

        h1 {
          font-size: 32px;
          margin-bottom: 8px;
          background: linear-gradient(90deg, #38bdf8, #818cf8);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }

        h2 {
          font-size: 18px;
          font-weight: 400;
          color: #94a3b8;
          margin-bottom: 28px;
        }

        .status {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          background: rgba(34, 197, 94, 0.15);
          color: #4ade80;
          border: 1px solid rgba(34, 197, 94, 0.35);
          padding: 10px 18px;
          border-radius: 10px;
          font-weight: 600;
          margin-bottom: 28px;
        }

        .status::before {
          content: "";
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #4ade80;
          box-shadow: 0 0 8px #4ade80;
        }

        .tags {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 10px;
          margin-bottom: 28px;
        }

        .tag {
          background: rgba(148, 163, 184, 0.12);
          border: 1px solid rgba(148, 163, 184, 0.25);
          color: #cbd5e1;
          font-size: 13px;
          padding: 6px 12px;
          border-radius: 8px;
        }

        .footer {
          border-top: 1px solid rgba(148, 163, 184, 0.15);
          padding-top: 20px;
          font-size: 13px;
          color: #64748b;
          display: flex;
          justify-content: space-between;
          flex-wrap: wrap;
          gap: 8px;
        }

        .footer strong {
          color: #94a3b8;
        }

        @media (max-width: 480px) {
          .card {
            padding: 32px 24px;
          }
          h1 {
            font-size: 26px;
          }
          .footer {
            flex-direction: column;
            text-align: center;
          }
        }
      </style>
    </head>
    <body>
      <div class="card">
        <div class="badge">TechOps Tutorials</div>
        <h1>Argo CD Demo Application</h1>
        <h2>Successfully Deployed via GitOps</h2>

        <div class="status">Sync Status: Healthy</div>

        <div class="tags">
          <span class="tag">Kubernetes</span>
          <span class="tag">GitOps</span>
          <span class="tag">Argo CD</span>
          <span class="tag">NGINX</span>
        </div>

        <div class="footer">
          <span><strong>Episode</strong> 4</span>
          <span><strong>Version</strong> 5.0 - Bad Release</span>
        </div>
      </div>
    </body>
    </html>
