apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
  namespace: guestbook

spec:
  replicas: 2

  selector:
    matchLabels:
      app: guestbook-ui

  template:
    metadata:
      labels:
        app: guestbook-ui

    spec:
      containers:
      - name: guestbook-ui
        image: gcr.io/google-samples/gb-frontend:v5

        ports:
        - containerPort: 80
